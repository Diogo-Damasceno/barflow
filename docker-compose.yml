services:
  postgres:
    image: postgres:16-alpine
    container_name: barflow-pg
    environment:
      POSTGRES_USER: barflow
      POSTGRES_PASSWORD: barflow
      POSTGRES_DB: barflow
    ports:
      - "5432:5432"
    volumes:
      - barflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barflow -d barflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: barflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://barflow:barflow@postgres:5432/barflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret-min-32-chars!!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars!!}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      HTTPS: ${HTTPS:-false}
    ports:
      - "3001:3001"
    healthcheck:
      # Node 20 tem fetch global; checa o /docs sem depender de wget/curl.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    container_name: barflow-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      # o front chama a API pelo nome do serviço dentro da rede do compose
      NEXT_PUBLIC_API_URL: http://api:3001
    # porta publicada no docker-compose.prod.yml (3000) ou override de teste (3005)

volumes:
  barflow_pg:
