services:
  postgres:
    image: postgres:16-alpine
    container_name: barflow-pg
    environment:
      POSTGRES_USER: barflow
      POSTGRES_PASSWORD: barflow
      POSTGRES_DB: barflow
    ports:
      - "5432:5432"
    volumes:
      - barflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barflow -d barflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: barflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://barflow:barflow@postgres:5432/barflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret-min-32-chars!!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars!!}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      HTTPS: ${HTTPS:-false}
    ports:
      - "3001:3001"
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]

volumes:
  barflow_pg:
